server {
    listen 80;
    server_name _;

    # Статические файлы отдаёт непосредственно Nginx.
    # URL: /static/cat.jpg
    # Файл: /app/static/cat.jpg
    location /static/ {
        alias /app/static/;
        autoindex off;
        expires 1h;
    }

    # Все остальные запросы идут в WSGI-приложение uWSGI.
    location / {
        include uwsgi_params;
        uwsgi_pass app:8000;
    }
}