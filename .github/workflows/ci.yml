name: FastAPI CI

on:
  push:
  pull_request:

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: module_30_ci_linters/homework/hw1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check import sorting
        run: isort --check-only .

      - name: Check formatting
        run: black --check .

      - name: Run Flake8
        run: flake8 .

      - name: Run mypy
        run: mypy .

      - name: Run tests
        run: pytest -v